<!DOCTYPE html>
<html>
  <head>
  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
}
.nav {
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:#000;
}
.nav a {
  color:white;
  margin-left:15px;
  text-decoration:none;
}
.hero {
  text-align:center;
  padding:100px 20px;
  background:linear-gradient(135deg,#111,#000);
}
.hero h1 {
  font-size:50px;
}
.btn {
  background:red;
  padding:12px 25px;
  border-radius:25px;
  text-decoration:none;
  color:white;
}
.section {
  padding:50px 20px;
  text-align:center;
}
.cards {
  display:flex;
  gap:20px;
  justify-content:center;
}
.card {
  background:#111;
  padding:20px;
  border-radius:10px;
  width:200px;
}
.footer {
  text-align:center;
  padding:20px;
  color:gray;
}
  .hero {
  text-align:center;
  padding:100px 20px;
  background: radial-gradient(circle at center, #111 0%, #000 100%);
  }
  .card:hover {
  transform: scale(1.05);
  transition: 0.3s;
  background:#1a1a1a;
  }
  .btn {
  background:red;
  padding:12px 25px;
  border-radius:25px;
  text-decoration:none;
  color:white;
  box-shadow:0 0 15px red;
  }
  .cards {
  flex-wrap: wrap;
  }
  .hero {
  animation: fadeIn 1.5s ease-in;
}

@keyframes fadeIn {
  from {opacity:0;}
  to {opacity:1;}
}
  .section {
  padding:80px 20px;
  }
  .nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 20px rgba(255,0,0,0.3);
}

.logo {
  color: white;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.menu a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  font-size: 15px;
  transition: 0.3s;
}

.menu a:hover {
  color: red;
  text-shadow: 0 0 10px red;
}
</style>
</head>

<body>

<div class="nav">
  <h2>Flash Hub</h2>
  <div>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</div>

<div class="hero">
  <h1>Flash Hub</h1>
  <p>Ultra Premium News Platform</p>
  <a href="#" class="btn">Explore</a>
</div>
<div class="section">
  <h2>Why Flash Hub?</h2>
  <p>We provide fast, accurate and modern updates designed for today's audience.</p>
</div>
<div class="section">
  <h2>Our Features</h2>
  <div class="cards">
    <div class="card">⚡ Fast Updates</div>
    <div class="card">🌍 Global News</div>
    <div class="card">🔒 Trusted Info</div>
  </div>
</div>

<div class="footer">
  © 2026 Flash Hub
</div>

</body>
</html>
