<!DOCTYPE html>
<html>
<head>
<title>Flash Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
}
.nav {
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:#000;
}
.nav a {
  color:white;
  margin-left:15px;
  text-decoration:none;
}
.hero {
  text-align:center;
  padding:100px 20px;
  background:linear-gradient(135deg,#111,#000);
}
.hero h1 {
  font-size:50px;
}
.btn {
  background:red;
  padding:12px 25px;
  border-radius:25px;
  text-decoration:none;
  color:white;
}
.section {
  padding:50px 20px;
  text-align:center;
}
.cards {
  display:flex;
  gap:20px;
  justify-content:center;
}
.card {
  background:#111;
  padding:20px;
  border-radius:10px;
  width:200px;
}
.footer {
  text-align:center;
  padding:20px;
  color:gray;
}
</style>
</head>

<body>

<div class="nav">
  <h2>Flash Hub</h2>
  <div>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</div>

<div class="hero">
  <h1>Flash Hub</h1>
  <p>Ultra Premium News Platform</p>
  <a href="#" class="btn">Explore</a>
</div>

<div class="section">
  <h2>Our Features</h2>
  <div class="cards">
    <div class="card">⚡ Fast Updates</div>
    <div class="card">🌍 Global News</div>
    <div class="card">🔒 Trusted Info</div>
  </div>
</div>

<div class="footer">
  © 2026 Flash Hub
</div>

</body>
</html>
