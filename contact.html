<!DOCTYPE html>
<html>
<head>
<title>Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {background:#0a0a0a;color:white;font-family:Arial;margin:0;}
.nav {display:flex;justify-content:space-between;padding:15px 30px;background:#000;}
.nav a {color:white;text-decoration:none;margin-left:15px;}

.form-box {max-width:400px;margin:50px auto;}

input,textarea {
width:100%;padding:10px;margin-bottom:10px;border-radius:5px;border:none;
}

button {
width:100%;padding:10px;background:red;color:white;border:none;border-radius:20px;
}
</style>
</head>

<body>

<div class="nav">
  <h2>Flash Hub</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</div>
<div style="font-family:Arial, sans-serif;">

<!-- HEADER -->
<div style="background:linear-gradient(135deg,#000,#333);color:white;padding:60px;text-align:center;border-radius:12px;">
  <h1>Contact Us</h1>
  <p style="opacity:0.8;">We’d love to hear from you</p>
</div>

<!-- CONTACT INFO -->
<div style="margin-top:40px; text-align:center;">
  <h2>Get In Touch</h2>
  <p>Email: yourmail@gmail.com</p>
  <p>Location: India</p>
</div>

<!-- FORM -->
<div style="margin-top:40px; display:flex; justify-content:center;">
  <form style="width:100%; max-width:500px;">

    <input type="text" placeholder="Your Name" required 
    style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">

    <input type="email" placeholder="Your Email" required 
    style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">

    <textarea placeholder="Your Message" rows="5" required 
    style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;"></textarea>

    <button type="submit" 
    style="width:100%; padding:12px; background:red; color:white; border:none; border-radius:25px; font-size:16px;">
      Send Message
    </button>

  </form>
</div>

<!-- CTA -->
<div style="background:#111;color:white;padding:40px;text-align:center;margin-top:50px;border-radius:12px;">
  <h2>Stay Connected</h2>
  <p>Follow us for latest updates</p>
</div>

<!-- FOOTER -->
<div style="margin-top:40px;text-align:center;color:gray;">
  <p>© 2026 Flash Hub. All Rights Reserved.</p>
</div>

</div>
</body>
</html>
